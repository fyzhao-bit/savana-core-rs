name: wheels

# Build distributable `savana_core` wheels (the PyO3 kernel binding) so the
# Python server can pin a PRE-BUILT wheel instead of a git source dependency —
# i.e. deploy without a Rust toolchain at install time.
#
# The wheel uses `ort` in load-dynamic mode, so it does NOT link ONNX Runtime at
# build time; the runtime `onnxruntime` package supplies the dylib (discovered via
# ORT_DYLIB_PATH by the Python side). That keeps these wheels portable (manylinux
# + macOS) and free of native ORT at build.
#
# Triggers: a version tag (`v*`) publishes wheels to the GitHub Release; manual
# `workflow_dispatch` builds them as artifacts for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach wheels to the Release on a tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Build release wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --strip
            --out dist
            --manifest-path crates/savana-core-py/Cargo.toml
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
      - name: Upload wheels (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: savana-core-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Attach wheels to the Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
