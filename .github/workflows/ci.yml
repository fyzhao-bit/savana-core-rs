name: ci
on: [push, pull_request]
jobs:
  private-continuations:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with: { components: clippy, rustfmt }
      - run: cargo fmt -p savana-private-workflow -- --check
      - run: cargo clippy -p savana-private-workflow --all-targets --no-deps --locked -- -D warnings
      - run: cargo test -p savana-private-workflow --all-targets --locked
      - run: |
          private_fixture_dir=$(mktemp -d)
          cargo run -p savana-private-workflow --example invoice_loop --locked -- "$private_fixture_dir"
  task-trace-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 -m unittest verification.task_trace.test_check -v
      - run: python3 -m verification.task_trace.check --check-recorded verification/task_trace/results.json
  kerneld:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with: { components: clippy, rustfmt }
      - run: tools/check-frozen-v2-core.sh
      - run: sh tools/tests/check-frozen-v2-core.sh tools/check-frozen-v2-core.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - if: runner.os == 'macOS'
        run: cargo test -p savana-platform-identity --test macos_worker_sandbox --all-features --locked
        env:
          SAVANA_REQUIRE_NATIVE_MACOS_SANDBOX_TEST: "1"
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: cargo build --workspace --release --locked
      - if: runner.os == 'Linux'
        run: systemd-analyze verify deploy/systemd/*
