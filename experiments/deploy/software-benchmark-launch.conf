# EXPLICIT DISPOSABLE EXPERIMENT ONLY. Never install on production hosts.
# Install as savana-protected-experiment.service.d/90-software-benchmark.conf.
# A run also needs a later drop-in whose ExecStart adds --planner-experiment
# <spec>; without one the launcher refuses to start.
[Unit]
ConditionPathExists=/run/savana-file-backed-disposable
ConditionPathExists=/etc/savana/benchmark-preauthorization.json
[Service]
ExecStart=
ExecStart=/opt/savana-bench-venv/bin/python -m savana_bench.protected_launch --software-benchmark
