# EXPLICIT DISPOSABLE EXPERIMENT ONLY. Never install on production hosts.
# Install as savana-experiment-auth.service.d/90-software-benchmark.conf.
[Unit]
ConditionPathExists=/run/savana-file-backed-disposable
ConditionPathExists=/etc/savana/benchmark-preauthorization.json
[Service]
ExecStart=
ExecStart=/opt/savana-bench-venv/bin/python -m savana_bench.protected_auth --software-benchmark
