[workspace]
resolver = "2"
members = [
  "crates/libsavana-ner",
  "crates/savana-client",
  "crates/savana-continuation-core",
  "crates/savana-agentd",
  "crates/savana-approvald",
  "crates/savana-execd",
  "crates/savana-leak-gate",
  "crates/savana-ingressd",
  "crates/savana-input-runtime",
  "crates/savana-kernel-protocol",
  "crates/savana-kerneld",
  "crates/savana-core-py",
  "crates/savana-openclaw-release",
  "crates/savana-policy-core",
  "crates/savana-private-workflow",
  "crates/savana-platform-identity",
  "crates/savana-vault",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
thiserror = "=1.0.69"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
minicbor = { version = "=0.25.1", features = ["std", "derive"] }
base64 = "=0.22.1"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "zeroize", "pkcs8"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
aes-gcm = "=0.10.3"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
rustls = { version = "=0.23.42", default-features = false, features = ["std", "ring"] }
getrandom = "=0.2.17"
zeroize = { version = "=1.8.1", features = ["derive"] }
unicode-normalization = "=0.1.22"
url = "=2.5.8"
# Backtracking engine, required by the G2 leak gate: Python `re`'s `\b` is
# rewritten as its literal two-sided definition over the pinned CPython 15.0.0
# word class, and that rewrite needs lookaround. Backtracking is bounded and
# every engine error fails closed at the gate, so adversarial input can only
# over-block.
fancy-regex = "=0.14.0"
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user", "fs", "signal", "poll"] }
rustix = { version = "=1.1.4", default-features = false, features = ["alloc", "event", "fs", "process", "stdio", "std"] }
signal-hook = "=0.3.18"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "json"] }
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }

[profile.release]
panic = "abort"
overflow-checks = true

# Native peer measurement hashes whole executables within a bounded broker
# exchange. Unoptimized SHA-256 exceeds that budget on the ARM64 integration
# host when two reciprocal measurements queue. Keep verification and deadlines
# unchanged; optimize only the hashing implementation, not the debug trust mode.
[profile.dev.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true
