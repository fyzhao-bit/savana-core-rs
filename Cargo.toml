[workspace]
resolver = "2"
members = [
  "crates/libsavana-ner",
  "crates/savana-core-py",
  "crates/savana-kernel-protocol",
  "crates/savana-policy-core",
  "crates/savana-kerneld",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
thiserror = "=1.0.69"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
minicbor = { version = "=0.25.1", features = ["std", "derive"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "zeroize", "pkcs8"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.2.17"
zeroize = { version = "=1.8.1", features = ["derive"] }
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user", "fs", "signal"] }
rustix = { version = "=1.1.4", default-features = false, features = ["alloc", "event", "fs", "process", "stdio", "std"] }
signal-hook = "=0.3.18"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt", "json"] }
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }

[profile.release]
panic = "abort"
overflow-checks = true
