# Install as /usr/lib/tmpfiles.d/savana-kernel-approval-v04.conf before enabling
# the socket. SocketUser/SocketGroup do not set parent-directory ownership.
d /run/savana 0711 root root - -
d /run/savana/approvald 0711 savana-approval savana-approval - -
d /run/savana/approvald/kerneld 0710 savana-approval savana-kernel - -
