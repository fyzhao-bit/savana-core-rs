# Required for Linux startup. Enrollment is public, installer-authenticated data;
# neither signing authorization nor NV write authorization is given to kerneld.
[Unit]
Requires=savana-tpm-authority-v3.socket savana-identity-broker-v2.socket
After=savana-tpm-authority-v3.socket savana-identity-broker-v2.socket

[Service]
LoadCredential=tpm-installer-v3.pub:/etc/savana/tpm-v3-installer.pub
LoadCredential=tpm-enrollment-v3.bin:/etc/savana/tpm-enrollment-v3.bin
