# Install as savana-kerneld.service.d/kernel-approval-v04.conf together with
# the kernel_approval block in the signed kerneld bootstrap; never alone.
# The seed is distinct from Agent, Ingress, envelope and executor credentials.
[Unit]
Requires=savana-approvald-kernel-v04.socket
After=savana-approvald-kernel-v04.socket

[Service]
LoadCredentialEncrypted=kernel-approval-v04.seed:/etc/savana/credentials/kerneld/kernel-approval-v04.seed.cred
