# Opt-in drop-in, not installed by default. The signed kerneld bootstrap must
# pin this issuer's public key/key ID; source and task dispatch policies must
# independently pin the same public key. Never reuse another role's seed.
[Service]
LoadCredentialEncrypted=managed-resource-v04.seed:/etc/savana/credentials/kerneld/managed-resource-v04.seed.cred
