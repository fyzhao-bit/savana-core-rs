[package]
name = "savana-agentd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["savana-approvald/test-support"]
macos-development-authority = [
    "savana-approvald/macos-development-authority",
    "savana-policy-core/macos-development-authority",
]

[dependencies]
savana-kernel-protocol = { path = "../savana-kernel-protocol" }
savana-approvald = { path = "../savana-approvald" }
savana-platform-identity = { path = "../savana-platform-identity" }
savana-policy-core = { path = "../savana-policy-core" }
thiserror.workspace = true
aes-gcm.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true
minicbor.workspace = true
nix.workspace = true
rustix.workspace = true
rustls.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true
x25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true

[dev-dependencies]
tempfile = "=3.23.0"

[[test]]
name = "macos_startup"
path = "tests/macos_startup.rs"
required-features = ["macos-development-authority"]
