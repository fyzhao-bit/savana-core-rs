[package]
name = "savana-kerneld"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["savana-policy-core/test-support"]

[dependencies]
savana-kernel-protocol = { path = "../savana-kernel-protocol" }
savana-policy-core = { path = "../savana-policy-core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
nix.workspace = true
rustix.workspace = true
signal-hook.workspace = true
sha2.workspace = true
getrandom.workspace = true
minicbor.workspace = true

[dev-dependencies]
tempfile = "=3.23.0"
savana-policy-core = { path = "../savana-policy-core", features = ["test-support"] }

[[test]]
name = "production_state_machine"
path = "tests/production_state_machine.rs"
required-features = ["test-support"]

[[test]]
name = "policy_protocol"
path = "tests/policy_protocol.rs"
required-features = ["test-support"]

[[test]]
name = "policy_rollover"
path = "tests/policy_rollover.rs"
required-features = ["test-support"]

[[test]]
name = "policy_fail_stop"
path = "tests/policy_fail_stop.rs"
required-features = ["test-support"]
